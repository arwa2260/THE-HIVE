<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Services | THE HIVE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; color: #0f172a; margin: 0; }
        header { background: white; padding: 15px 5%; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: bold; color: #0066cc; text-decoration: none; }
        nav a { margin-left: 20px; text-decoration: none; color: #0f172a; font-weight: 600; }
        
        .container { max-width: 900px; margin: 40px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #0066cc; text-align: center; }
        p.subtitle { text-align: center; color: #475569; margin-bottom: 30px; }

        /* Form Styling */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px;
        }
        .btn-submit { background: #0066cc; color: white; width: 100%; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: #004999; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">THE HIVE</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services & Contracts</a>
            <a href="courses.html">Academy</a>
        </nav>
    </header>

    <div class="container">
        <h1>Request Corporate Service / Staffing</h1>
        <p class="subtitle">Fill out the form below and our cybersecurity team will contact your organization within 24 hours.</p>

        <form onsubmit="alert('Thank you! Your request has been received. Our team will contact you shortly.'); return false;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="e.g. John Doe" required>
            </div>
            <div class="form-group">
                <label>Work Email (Corporate Domain)</label>
                <input type="email" placeholder="name@company.com" required>
            </div>
            <div class="form-group">
                <label>Organization / Company Name</label>
                <input type="text" placeholder="e.g. HIVE Solutions Ltd." required>
            </div>
            <div class="form-group">
                <label>Phone Number / WhatsApp</label>
                <input type="tel" placeholder="+20 100 000 0000" required>
            </div>
            <div class="form-group">
                <label>Required Service</label>
                <select required>
                    <option value="">Select Service Needed...</option>
                    <option>Penetration Testing & Vulnerability Assessment</option>
                    <option>24/7 Managed SOC Surveillance</option>
                    <option>Dedicated Cybersecurity Staffing / Contracting</option>
                    <option>Incident Response & Digital Forensics</option>
                </select>
            </div>
            <div class="form-group">
                <label>Additional Details or Requirements</label>
                <textarea rows="4" placeholder="Describe your company's security needs..."></textarea>
            </div>
            <button type="submit" class="btn-submit">Submit Contract Request</button>
        </form>
    </div>
</body>
</html>
